<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Masjid Daar Us Sunnah — Contact Us test copy</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!--
    TEST COPY — not the real page, not linked from anywhere live.
    Loads kiosk-test.js (NOT production kiosk.js) so ALL panels render from
    real Firestore data via the exact same data-fetching/render logic as
    production, except the Contact Information panel's "Contact Us" entry
    (see kiosk-test.js for that one isolated change).
    .cphone-stack/.cemail are kept local to this file's own <style> block
    since the shared style.css is out of scope for this test pass — once
    the Contact Us layout is approved, those two rules move into the real
    style.css alongside the real kiosk.js change.
  -->
  <style>
    .cphone-stack{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
    .cemail{font-size:clamp(11px,1.45vh,16px);font-weight:400;color:var(--ts);white-space:nowrap}
  </style>
</head>
<body>
  <div class="board">

    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/logo.png" alt="Masjid Daar Us Sunnah">
        <span class="brand-title">Masjid Daar us Sunnah <span class="sep">|</span> Community Board</span>
      </div>
      <div class="datebox">
        <div class="dateline"><span class="d-date" id="dateline">&nbsp;</span><span class="d-sep">&middot;</span><span class="d-time" id="clock">&nbsp;</span></div>
        <div class="hijri" id="hijri" lang="ar" dir="rtl">&nbsp;</div>
      </div>
    </header>

    <div class="row-top">
      <section class="card hero" id="panel-ring">
        <div class="hero-eyebrow">Next Prayer</div>
      </section>

      <section class="card events" id="panel-events">
        <h2>Upcoming events</h2>
        <div id="eventsList" class="events-body"></div>
      </section>
    </div>

    <div class="row-bot">
      <section class="card" id="panel-prayers">
        <h2>Prayer Times</h2>
        <div id="prayerList" class="prayer-body"></div>
      </section>

      <section class="card" id="panel-reminder">
        <h2 id="reminderTitle">Daily Reminder</h2>
        <div class="rem-body">
          <div class="rem-ar" id="remAr" lang="ar" dir="rtl"></div>
          <div class="rem-tr" id="remTr"></div>
          <div class="rem-ref" id="remRef"></div>
        </div>
      </section>

      <section class="card" id="panel-contact">
        <h2>Contact information</h2>
        <div class="clist" id="contactList"></div>
      </section>
    </div>
  </div>

  <script type="module" src="kiosk-test.js"></script>
</body>
</html>
