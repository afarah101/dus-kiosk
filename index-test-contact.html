<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Masjid Daar Us Sunnah — Contact Us test copy</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!--
    TEST COPY — not the real page, not linked from anywhere live.
    Purpose: visually confirm the "Contact Us" row's layout/formatting only.
    - No <script src="kiosk.js"> on purpose: kiosk.js would immediately
      overwrite #contactList (and everything else) via its own render
      functions, which defeats the point of a static hardcoded test. This
      also means Next Prayer / Upcoming Events / Prayer Times / Daily
      Reminder show empty (title-only) — they are NOT wired to Firestore or
      any data here, by design, not a bug.
    - Masjid Management and WhatsApp rows below are hardcoded to match what
      kiosk.js currently renders in production — static placeholder text,
      not live data.
    - The two new classes below (.test-cphone-stack / .test-cemail) exist
      only in this file's own <style> block, not in the shared style.css —
      kept local so this test copy doesn't require touching the real
      stylesheet before the layout itself is approved.
  -->
  <style>
    .test-cphone-stack{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
    .test-cemail{font-size:clamp(11px,1.45vh,16px);font-weight:400;color:var(--ts);white-space:nowrap}
  </style>
</head>
<body>
  <div class="board">

    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/logo.png" alt="Masjid Daar Us Sunnah">

      </div>
      <div class="datebox">
        <div class="dateline"><span class="d-date">&nbsp;</span><span class="d-sep">&middot;</span><span class="d-time">&nbsp;</span></div>
        <div class="hijri" lang="ar" dir="rtl">&nbsp;</div>
      </div>
